name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jvm-mon-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: actions/setup-go@v5
        with:
          go-version-file: jvm-mon-go/go.mod
          cache-dependency-path: jvm-mon-go/go.sum

      # The Go binary embeds build/libs/jvm-mon-go.jar, so build the agent first
      - name: Build Java agent
        run: ./make-agent.sh

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/jvm-mon
